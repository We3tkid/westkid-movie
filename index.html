<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b10"><title>WestKid Movie | دنیای سینما</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#f5f5f7;background:#0b0b10}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#101016ef;backdrop-filter:blur(12px);border-bottom:1px solid #292932;padding:17px max(5%,calc((100% - 1150px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:24px;font-weight:900;letter-spacing:-1px;direction:ltr}.brand span{color:#f04452}.small{color:#aaaab4;font-size:12px}nav{display:flex;gap:9px}.navbtn,.pill{border:1px solid #353540;background:#1c1c25;color:#dddde3;border-radius:50px;padding:10px 15px}.navbtn.active,.pill.active{background:#e63748;color:white;border-color:#e63748}.wrap{max-width:1150px;margin:auto;padding:28px 5%}.hero{border:1px solid #39313b;border-radius:24px;min-height:310px;background:radial-gradient(circle at 15% 45%,#872c4d99,transparent 43%),linear-gradient(125deg,#22202e,#13131c 75%);display:flex;align-items:center;padding:35px;position:relative;overflow:hidden}.hero:after{content:'✦';font-size:240px;position:absolute;left:5%;top:0;color:#ffffff12;transform:rotate(-20deg)}.hero-content{position:relative;z-index:1;max-width:570px}.eyebrow{color:#ff8995;font-weight:bold;font-size:13px}.hero h1{font-size:clamp(29px,5vw,52px);line-height:1.4;margin:14px 0}.hero p{color:#c9c5ce;line-height:2}.cta{background:#e63748;border:0;color:white;border-radius:12px;padding:13px 20px;font-weight:bold;margin-top:10px}.searchbar{display:flex;gap:10px;margin:30px 0 22px}.searchbar input{background:#1a1a23;border:1px solid #383843;color:white;border-radius:13px;padding:15px;flex:1;min-width:0;outline:none}.searchbar input:focus{border-color:#e63748}.filters{display:flex;gap:9px;overflow-x:auto;padding-bottom:10px}.pill{white-space:nowrap}h2{font-size:23px;margin:27px 0 19px}.count{font-size:13px;color:#9999a5;font-weight:normal}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.movie{border:1px solid #292933;border-radius:17px;overflow:hidden;background:#16161e;transition:transform .2s}.movie:hover{transform:translateY(-4px)}.poster{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;position:relative;overflow:hidden}.poster:before{content:'';position:absolute;inset:15%;border:1px solid #ffffff24;border-radius:100px;transform:rotate(35deg)}.posterTitle{font-family:Georgia,serif;font-weight:900;font-size:clamp(19px,3vw,32px);text-shadow:0 3px 14px #0009;position:relative;direction:ltr}.tag{position:absolute;right:10px;top:10px;background:#0b0b10bb;border:1px solid #ffffff22;border-radius:8px;padding:5px 8px;font-size:11px}.fav{position:absolute;left:9px;top:9px;border:0;border-radius:50%;background:#14141ccc;color:#fff;font-size:24px;width:39px;height:39px}.fav.on{color:#ff6572}.info{padding:15px}.info strong{font-size:16px}.meta{color:#aaaab4;font-size:12px;margin:9px 0 12px}.detail{display:block;text-align:center;text-decoration:none;border:1px solid #42424c;background:#262630;color:white;border-radius:9px;padding:10px;width:100%}.empty{padding:45px;text-align:center;color:#aaaab4;grid-column:1/-1}footer{text-align:center;color:#777783;padding:40px 15px;font-size:12px}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}.overlay.open{display:flex}.dialog{background:#1d1d27;border:1px solid #42424b;border-radius:20px;padding:27px;max-width:510px;width:100%;max-height:90vh;overflow:auto}.dialog h2{margin-top:10px}.dialog p{line-height:2;color:#c5c5d0}.close{float:left;background:#353540;border:0;color:white;border-radius:9px;padding:8px 13px}.notice{background:#24202a;border-right:3px solid #e63748;padding:12px;border-radius:8px;font-size:12px;color:#d3cbd2;margin-top:15px}@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.wrap{padding:18px 4%}.hero{padding:26px;min-height:280px}}@media(max-width:520px){header{padding:14px 4%}.brand{font-size:20px}.small{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.posterTitle{font-size:23px}.hero h1{font-size:29px}.hero p{font-size:13px}.info{padding:11px}.info strong{font-size:14px}.navbtn{padding:9px 11px;font-size:12px}}


.status{margin:15px 0;color:#d6a7ad;font-size:13px}.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.poster:has(img) .posterTitle{display:none}</style></head><body>
<header><div><div class="brand">WESTKID <span>MOVIE</span></div><div class="small">سینما، از نگاه تو</div></div><nav><button class="navbtn active" id="allBtn">همه آثار</button><button class="navbtn" id="favBtn">♥ علاقه‌مندی‌ها</button></nav></header>
<main class="wrap"><section class="hero"><div class="hero-content"><div class="eyebrow">✦ به دنیای فیلم و سریال خوش اومدی</div><h1>هر داستان،<br>یک دنیای تازه.</h1><p>فیلم‌ها و سریال‌های جذاب رو کشف کن، درباره‌شون بخون و فهرست شخصی خودت رو بساز.</p><button class="cta" id="explore">کشف فیلم‌ها ←</button></div></section><div class="searchbar"><input id="search" type="search" placeholder="نام فیلم یا سریال رو جست‌وجو کن..."></div><div class="filters" id="filters"></div><p class="status" id="status" role="status">در حال دریافت فیلم‌ها...</p><h2>منتخب سینما <span class="count" id="count"></span></h2><div class="grid" id="grid"></div></main><footer>WestKid Movie © معرفی فیلم و سریال</footer><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="dialog"><button class="close" id="close">بستن ✕</button><div id="dialogContent"></div></div></div>
<script>
// فقط کلید عمومی Publishable را جایگزین کن؛ هرگز secret یا service_role نگذار.
const SUPABASE_URL = 'https://luzdjmpkeiodcofwsphb.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_RJy1GZbMNSWct1RIQCeWjA_16ubpKsC';
const $ = id => document.getElementById(id);
const escapeHTML = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let movies=[], genre='همه', view='all';
let favorites=[];try{favorites=JSON.parse(localStorage.getItem('westkid_favorites_online')||'[]')}catch(e){}
function render(){
 const types=['همه','فیلم','سریال',...new Set(movies.map(m=>m.genre).filter(Boolean))];
 $('filters').innerHTML=types.map((g,i)=>`<button class="pill ${g===genre?'active':''}" data-filter="${i}">${escapeHTML(g)}</button>`).join('');
 const q=$('search').value.trim().toLowerCase();
 const list=movies.filter(m=>(genre==='همه'||m.genre===genre||m.type===genre)&&(view!=='favs'||favorites.includes(m.id))&&[m.title,m.english_title,m.description].some(x=>String(x||'').toLowerCase().includes(q)));
 $('count').textContent=`(${list.length} عنوان)`;
 $('grid').innerHTML=list.length?list.map(m=>`<article class="movie"><div class="poster" style="background:linear-gradient(150deg,#553344,#12141c)"><span class="tag">${escapeHTML(m.type||'فیلم')}</span><button class="fav ${favorites.includes(m.id)?'on':''}" data-fav="${m.id}" aria-label="علاقه‌مندی">${favorites.includes(m.id)?'♥':'♡'}</button>${m.poster_url&&/^https:\/\//i.test(m.poster_url)?`<img loading="lazy" src="${escapeHTML(m.poster_url)}" alt="پوستر ${escapeHTML(m.title)}">`:''}<span class="posterTitle">${escapeHTML(m.english_title||m.title)}</span></div><div class="info"><strong>${escapeHTML(m.title)}</strong><div class="meta">${escapeHTML(m.release_year||'—')} · ⭐ ${escapeHTML(m.rating??'—')} · ${escapeHTML(m.genre||'—')}</div><a class="detail" href="movie.html?id=${encodeURIComponent(m.id)}">مشاهده جزئیات ←</a></div></article>`).join(''):'<div class="empty">فعلاً فیلمی برای نمایش پیدا نشد.</div>';
}
$('explore').onclick=()=>{$('search').scrollIntoView({behavior:'smooth',block:'center'});$('search').focus()};
$('allBtn').onclick=()=>{view='all';$('allBtn').classList.add('active');$('favBtn').classList.remove('active');render()};
$('favBtn').onclick=()=>{view='favs';$('favBtn').classList.add('active');$('allBtn').classList.remove('active');render()};
$('search').oninput=render;
$('filters').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;genre=['همه','فیلم','سریال',...new Set(movies.map(m=>m.genre).filter(Boolean))][Number(b.dataset.filter)];render()};
$('grid').onclick=e=>{const f=e.target.closest('[data-fav]');if(f){const id=f.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];try{localStorage.setItem('westkid_favorites_online',JSON.stringify(favorites))}catch(e){}render();return}const d=e.target.closest('[data-detail]');if(!d)return;const m=movies.find(x=>x.id===d.dataset.detail);if(!m)return;$('dialogContent').innerHTML=`<div class="eyebrow">${escapeHTML(m.type||'فیلم')} · ${escapeHTML(m.genre||'')}</div><h2>${escapeHTML(m.title)}</h2><div style="direction:ltr;text-align:right;color:#aaa">${escapeHTML(m.english_title||'')}</div><p>⭐ امتیاز: ${escapeHTML(m.rating??'—')} / 10<br>سال انتشار: ${escapeHTML(m.release_year||'—')}</p><h3>داستان</h3><p>${escapeHTML(m.description||'توضیحی ثبت نشده است.')}</p>`;$('overlay').classList.add('open')};
$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};
async function loadMovies(){
 if(SUPABASE_PUBLISHABLE_KEY==='PASTE_YOUR_PUBLISHABLE_KEY_HERE'){$('status').textContent='برای اتصال، کلید عمومی Supabase را در فایل index.html قرار بده.';return}
 try{const r=await fetch(SUPABASE_URL+'/rest/v1/movies?select=id,title,english_title,type,genre,release_year,rating,description,poster_url&order=created_at.desc&limit=500',{headers:{'apikey':SUPABASE_PUBLISHABLE_KEY}});if(!r.ok)throw new Error('HTTP '+r.status);movies=await r.json();$('status').textContent='';render()}catch(e){$('status').textContent='دریافت فیلم‌ها ناموفق بود ('+e.message+'). اتصال اینترنت و کلید عمومی را بررسی کن.'}
}
render();loadMovies();
</script></body></html>
